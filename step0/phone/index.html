<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="互传测试">
<meta name="theme-color" content="#2563eb">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>互传测试</title>
<style>
  :root { --bg:#fff; --fg:#1f1f1f; --muted:#6b6b6b; --line:#e3e3e3; --card:#f4f4f5; --ok:#1a7f37; --bad:#cf222e; --wait:#9a6700; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111214; --fg:#ececec; --muted:#9a9a9a; --line:#2f3033; --card:#1d1e21; --ok:#4ac26b; --bad:#ff7b72; --wait:#d29922; --accent:#6ea8fe; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; padding: max(14px, env(safe-area-inset-top)) 16px 40px; background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system, "PingFang SC", system-ui, sans-serif; }
  h1 { font-size:20px; margin:0 0 4px; }
  h1 small { font-size:13px; color:var(--muted); font-weight:400; }
  h2 { font-size:16px; margin:0 0 8px; }
  section { border-top:1px solid var(--line); padding:14px 0; }
  .status { font-size:14px; margin-bottom:6px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .wait { color:var(--wait); }
  .small, .hint { font-size:13px; color:var(--muted); margin:0 0 8px; }
  .big { display:block; width:100%; font:inherit; font-size:18px; font-weight:600; padding:16px; margin:0 0 10px; border:none; border-radius:14px; background:#2563eb; color:#fff; }
  .big.alt { background:var(--card); color:var(--fg); border:1px solid var(--line); }
  .big:active { opacity:.7; }
  textarea { width:100%; font:inherit; padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg); }
  button { font:inherit; }
  .btn { padding:8px 14px; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:8px; margin:4px 6px 0 0; }
  .btn.chosen { outline:2px solid var(--accent); }
  .item { background:var(--card); border-radius:12px; padding:10px 12px; margin-bottom:10px; }
  .item .meta { font-size:12px; color:var(--muted); }
  .item .text { white-space:pre-wrap; word-break:break-all; margin:4px 0 8px; font-size:17px; }
  .checks { padding-left:20px; margin:0; }
  .checks li { margin-bottom:12px; }
  .checks .name { font-weight:600; }
  .checks .res { font-size:14px; }
  .progress { font-size:14px; color:var(--muted); min-height:20px; }
  a { color:var(--accent); }
  pre { white-space:pre-wrap; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
  <h1>互传测试 <small>第 0 步 · 手机端</small></h1>
  <div id="status" class="status">正在启动…</div>

  <section id="nopair" hidden>
    <p class="bad">还没配对。请用 iPhone 相机扫电脑侧边栏里的二维码。</p>
  </section>

  <section>
    <button id="paste" class="big">粘贴并发送到电脑</button>
    <button id="pick" class="big alt">选一张图片发送</button>
    <input id="file" type="file" accept="image/*" hidden>
    <div id="progress" class="progress"></div>
    <textarea id="txt" rows="2" placeholder="也可以在这里打字，再点发送"></textarea>
    <button id="sendTxt" class="btn">发送</button>
  </section>

  <section>
    <h2>电脑发来的</h2>
    <div id="items"><p class="small">还没收到</p></div>
  </section>

  <section>
    <h2>测试清单</h2>
    <p class="hint">带按钮的项目试完点一下。全部做完点「复制测试结果」，粘贴发给 Claude。</p>
    <ol id="checks" class="checks"></ol>
    <button id="report" class="big">复制测试结果</button>
    <div id="reportTip" class="small"></div>
    <details><summary class="small">运行记录</summary><pre id="log"></pre></details>
  </section>

  <script src="config.js?v=3"></script>
  <script src="lib/mqtt.min.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
